# Build y push de la imagen del worker a GitHub Container Registry (GHCR).
# RunPod tira: ghcr.io/arielp79/melodai-worker:latest
name: Worker Docker (GHCR)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/worker-docker.yml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          push: true
          tags: |
            ghcr.io/arielp79/melodai-worker:latest
            ghcr.io/arielp79/melodai-worker:${{ github.sha }}
