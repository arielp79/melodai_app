# Render.com — orquestador MelodAI
# Runtime Node (más ligero que Docker en plan free; evita "Exited with status 9" por RAM).
services:
  - type: web
    name: melodai-orchestrator
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: node src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: NODE_ENV
        value: production
      - key: FIREBASE_PROJECT_ID
        value: melodaiapp
      - key: GCS_BUCKET_NAME
        value: melodaiapp.firebasestorage.app
      - key: SEPARATION_WORKER_MODE
        value: redis
      - key: SEPARATION_REDIS_FALLBACK_STUB
        value: false
      - key: MONGODB_DB
        value: melodai
      - key: AUTH_DISABLED
        value: false
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: FIREBASE_WEB_API_KEY
        sync: false
      - key: WORKER_API_KEY
        sync: false
      - key: ORCHESTRATOR_PUBLIC_URL
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
