# Render.com — orquestador MelodAI (alternativa a Cloud Run)
# Dashboard: conectar repo → Blueprint o crear Web Service manual con Docker.
services:
  - type: web
    name: melodai-orchestrator
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FIREBASE_PROJECT_ID
        value: melodaiapp
      - key: GCS_BUCKET_NAME
        value: melodaiapp.firebasestorage.app
      - key: SEPARATION_WORKER_MODE
        value: redis
      - key: SEPARATION_REDIS_FALLBACK_STUB
        value: false
      - key: MONGODB_DB
        value: melodai
      - key: AUTH_DISABLED
        value: false
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: FIREBASE_WEB_API_KEY
        sync: false
      - key: WORKER_API_KEY
        sync: false
      - key: ORCHESTRATOR_PUBLIC_URL
        sync: false
      # JSON minificado de service-account.json (Firebase/GCP)
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
